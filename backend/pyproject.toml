[project]
name = "tgpan"
version = "0.1.0"
description = "Private Telegram-backed drive"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "cryptography>=44",
  "argon2-cffi>=23",
  "httpx[socks]>=0.28,<1",
  "psycopg[binary,pool]>=3.2,<4",
]
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
